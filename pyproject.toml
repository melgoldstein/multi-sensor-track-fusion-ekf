[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "multi-sensor-track-fusion-ekf"
version = "0.1.0"
readme = "README.md"
description = "multi sensor track fusion ekf"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ['numpy>=1.26', 'scipy>=1.11', 'pydantic>=2.7']
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
track-fusion = "track_fusion.track_manager:main"
[tool.setuptools]
packages = ["track_fusion"]
package-dir = {"track_fusion" = "src"}
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
track_fusion = ["native/*.c"]

[tool.ruff]
line-length = 88
target-version = "py311"
